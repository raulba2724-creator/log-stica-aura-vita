[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auravita-logistics"
version = "0.1.0"
description = "Motor logístico modular para la rotación de lotes de AuraVita Espacios."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
auravita-logistics = "auravita_logistics.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
